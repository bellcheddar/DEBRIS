{% extends "base.html" %}
{% block title %}03 Pathways{% endblock %}

{% block content %}
<section class="card" id="card-pathways">
  <h2>Polymers, mechanisms and diseases</h2>
  <div class="chiprow">
    <label class="switch"><input type="checkbox" id="hide-other"> Hide the "other" groups</label>
  </div>
  <div class="panelgrid">
    <figure class="panel" id="panel-sankey">
      <div class="panelhead"><h3>Flows</h3>
        <a class="panel-open" data-open="sankey" href="/papers">Open in Papers</a></div>
      <div id="sankey" class="plot" style="min-height:660px"></div>
    </figure>
    <figure class="panel" id="panel-radar">
      <div class="panelhead"><h3>Mechanism profile</h3>
        <a class="panel-open" data-open="radar" href="/papers">Open in Papers</a></div>
      <div class="chiprow" style="padding:0 14px 6px">
        <select id="cat-a" aria-label="First disease category"></select>
        <select id="cat-b" aria-label="Second disease category to overlay">
          <option value="">No overlay</option>
        </select>
        <label class="switch"><input type="checkbox" id="pet-trace" checked> PET-specific trace</label>
      </div>
      <div id="radar" class="plot" style="min-height:600px"></div>
    </figure>
    <figure class="panel" id="panel-diseases">
      <div class="panelhead"><h3>Diseases</h3>
        <a class="panel-open" data-open="diseases" href="/papers">Open in Papers</a></div>
      <div id="disease-bars" class="plot" style="min-height:480px"></div>
    </figure>
    <figure class="panel" id="panel-mechanisms">
      <div class="panelhead"><h3>Mechanisms</h3>
        <a class="panel-open" data-open="mechanisms" href="/papers">Open in Papers</a></div>
      <div id="pathway-bars" class="plot" style="min-height:480px"></div>
    </figure>
  </div>
</section>

<section class="card" id="card-new">
  <h2>New combinations this week</h2>
  <div id="new-edges"></div>
</section>

{% include "_drawer.html" %}
{% endblock %}

{% block scripts %}
<script>window.PATHWAYS = {{ bundle|tojson }};</script>
<script src="{{ url_for('static', filename='js/pathways.js') }}?v={{ asset_version('js/pathways.js') }}"></script>
{% endblock %}
