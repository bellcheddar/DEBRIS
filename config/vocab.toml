# Evidence ladder (spec 5.4). Rung 6 is drawn even when empty.
[[rungs]]
rung = 1
label = "Detected in human tissue or fluid"
[[rungs]]
rung = 2
label = "Associated with outcome in a human cohort"
[[rungs]]
rung = 3
label = "Reproduced in vivo"
[[rungs]]
rung = 4
label = "Mechanism in vitro or ex vivo"
[[rungs]]
rung = 5
label = "Dose-response"
[[rungs]]
rung = 6
label = "Reversible on particle removal or degradation"

