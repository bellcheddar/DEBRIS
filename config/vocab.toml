# DEBRIS controlled vocabulary: the single source of truth for the tagging schema
# (spec 5.4). The tagger prompt, the validator, the app legends and the tests all
# read this file. Changing a value here changes every one of them.

schema_version = "1.0"

polymers = ["PET", "PS", "PE", "PP", "PVC", "PA", "PU", "PMMA", "PC", "PLA", "PTFE",
            "tyre_wear", "mixed_unspecified"]

size_classes = ["nano", "micro", "mixed", "unspecified"]

organ_systems = ["cardiovascular", "respiratory", "hematologic", "neurological", "sleep",
                 "gastrointestinal", "hepatic", "renal", "reproductive_placental",
                 "endocrine_metabolic", "immune", "dermal", "systemic"]

disease_categories = ["cancer_colorectal", "cancer_other", "atherosclerosis_mace", "thrombosis",
                      "hypertension_arrhythmia", "copd_asthma", "pulmonary_fibrosis",
                      "anaemia_haemolysis", "neuroinflammation_neurodegeneration",
                      "sleep_circadian", "ibd_gut", "liver_disease", "kidney_disease",
                      "pregnancy_outcomes", "metabolic_syndrome", "immune_dysfunction", "none"]

pathways = ["oxidative_stress", "inflammasome_il1b", "nfkb_cytokine", "endothelial_dysfunction",
            "platelet_activation_thrombosis", "fibrosis_tgfb", "emt_migration",
            "barrier_disruption", "mitochondrial_dysfunction", "apoptosis_ferroptosis",
            "dysbiosis", "dna_damage_genotoxicity", "immune_dysregulation",
            "leachate_chemical_toxicity"]

# not_applicable is the value for a paper the tagger judges irrelevant: the design of a
# paper that is not about plastic particles and disease is not a fact about this corpus,
# and labelling one anyway taught the tagger to use in_silico as a bin for off-topic work.
model_types = ["human_tissue", "human_cohort", "human_in_vitro", "organoid", "animal_in_vivo",
               "cell_line", "in_silico", "review", "meta_analysis", "not_applicable"]

# Fields that accept a free-text "other:<text>" value alongside the controlled terms.
open_fields = ["polymers", "pathways"]

