# One entry per anatomical site on the body map. `organs` are the organ_systems whose
# papers the site counts, so several systems can share a site and a system can appear at
# more than one. `x` and `y` are the anatomical anchor on the 360 x 720 figure (the organs' own
# drawing scaled into the torso, see _anatomy.html), `art` the
# organ drawing to light up, and `region` the grouping the tissue cards sort by. Adding a
# tissue is an entry here: no code changes anywhere.
[[body_nodes]]
key = "brain"
label = "Brain"
organs = ["neurological", "sleep"]
region = "Head"
art = "brain"
x = 180
y = 66.4
