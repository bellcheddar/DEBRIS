# nginx site for DEBRIS. provision.sh substitutes __SERVER_NAME__ and __BIND_ADDR__
# and installs this to /etc/nginx/sites-available/debris, then `certbot --nginx`
# adds the TLS block and the port-80 redirect.
# Copied from AlphaFraud's vhost and the droplet's codswallop vhost (see REUSE.md).

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # No uploads: the only thing a reader sends is a query string.
    client_max_body_size 1m;

    location /static/ {
        alias /opt/debris/app/static/;
        # Assets are versioned with ?v=<mtime>, so a changed file refetches while
        # plotly-2.35.2.min.js (4.6 MB) and the fonts cache hard.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
